version: '3.8'

services:
  db:
    image: postgres:15
    container_name: jet_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    container_name: jet_bot
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
volumes:
  postgres_data: